services:
  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-off job: download the models on first start, then exit.
  models:
    image: ollama/ollama:0.12.6
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${EMBED_MODEL:-nomic-embed-text} && ollama pull ${CHAT_MODEL:-qwen2.5:0.5b}"]
    restart: "no"

  api:
    build: .
    depends_on:
      models:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:0.5b}
    volumes:
      - index:/data
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

volumes:
  ollama:
  index:
